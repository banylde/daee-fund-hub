name: 更新总账户数据
on:
  schedule:
    - cron: "0 10 * * 1-5"   # UTC 10:00 = 北京时间 18:00，等四个看板盘后更新
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 自测并计算总账户
        run: python3 scripts/build.py
      - name: 提交 data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/summary.json data/changes.json
          if git diff --cached --quiet; then echo "无变化"; else git commit -m "data: $(TZ=Asia/Shanghai date '+%F %H:%M') 更新" && git push; fi
